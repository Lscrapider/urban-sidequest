spring:
  application:
    name: urban-sidequest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    openai:
      api-key: ${NEW_API_KEY}
      base-url: ${ROUTE_LLM_BASE_URL}
      chat:
        completions-path: ${ROUTE_LLM_COMPLETIONS_PATH}
        options:
          model: ${ROUTE_LLM_MODEL}
          temperature: ${ROUTE_LLM_TEMPERATURE}
          response-format:
            type: JSON_OBJECT
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info

amap:
  web:
    key: ${AMAP_WEB_KEY}
    base-url: ${AMAP_WEB_BASE_URL}
    connect-timeout: ${AMAP_WEB_CONNECT_TIMEOUT}
    read-timeout: ${AMAP_WEB_READ_TIMEOUT}
    key-qps: ${AMAP_WEB_KEY_QPS}
baidu:
  map:
    ak: ${BAIDU_MAP_AK}
    base-url: ${BAIDU_MAP_BASE_URL}
    connect-timeout: ${BAIDU_MAP_CONNECT_TIMEOUT}
    read-timeout: ${BAIDU_MAP_READ_TIMEOUT}
poi:
  search:
    provider: ${POI_SEARCH_PROVIDER}
    mix:
      amap-weight: ${POI_SEARCH_MIX_AMAP_WEIGHT}
      baidu-weight: ${POI_SEARCH_MIX_BAIDU_WEIGHT}
route:
  scoring:
    config-path: ${ROUTE_SCORING_CONFIG_PATH:}
  preference:
    training:
      raw-snapshot-enabled: ${ROUTE_PREFERENCE_TRAINING_RAW_SNAPSHOT_ENABLED}
auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    secret: ${AUTH_JWT_SECRET}
    access-token-validity-seconds: ${AUTH_JWT_ACCESS_TOKEN_VALIDITY_SECONDS}
  dev-verification-code: ${AUTH_DEV_VERIFICATION_CODE}
