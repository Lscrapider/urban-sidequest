spring:
  application:
    name: urban-sidequest-backend
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${NEW_API_KEY}
      base-url: ${ROUTE_LLM_BASE_URL}
      chat:
        completions-path: /chat/completions
        options:
          model: urben-route-generate
          temperature: 0.2
          response-format:
            type: JSON_OBJECT
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      url: ${SPRING_REDIS_URL}
      username: ${SPRING_REDIS_USERNAME:}
      password: ${SPRING_REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 200ms
  http:
    client:
      read-timeout: 1000s

server:
  port: 8082
  servlet:
    context-path: /urban-api

management:
  endpoints:
    web:
      exposure:
        include: health,info

amap:
  web:
    key: ${AMAP_WEB_KEY:}
    keys: ${AMAP_WEB_KEYS:}
    base-url: https://restapi.amap.com
    connect-timeout: 3s
    read-timeout: 8s
    key-qps: 2.8
baidu:
  map:
    ak: ${BAIDU_MAP_AK}
    base-url: https://api.map.baidu.com
    connect-timeout: 3s
    read-timeout: 8s
poi:
  search:
    provider: amap
    mix:
      amap-weight: 1
      baidu-weight: 5
route:
  scoring:
    config-path: ${ROUTE_SCORING_CONFIG_PATH}
  preference:
    training:
      storage:
        endpoint: ${ROUTE_PREF_MINIO_ENDPOINT}
        bucket: urban-sidequest-training
        access-key: ${ROUTE_PREF_MINIO_ACCESS_KEY}
        secret-key: ${ROUTE_PREF_MINIO_SECRET_KEY}
        secure: false
        prefix: route-preference
        write-enabled: true
  share:
    storage:
      bucket: urban-sidequest-shares
      prefix: route-share
      max-image-size: 2MB
auth:
  jwt:
    issuer: urban-sidequest
    secret: ${AUTH_JWT_SECRET}
    access-token-validity-seconds: 86400
  dev-verification-code: ${AUTH_DEV_VERIFICATION_CODE}
