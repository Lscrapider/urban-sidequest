spring:
  application:
    name: urban-sidequest-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urban_sidequest}
    username: ${SPRING_DATASOURCE_USERNAME:urban_sidequest}
    password: ${SPRING_DATASOURCE_PASSWORD:urban_sidequest_dev}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

amap:
  web:
    key: ${AMAP_WEB_KEY:120e80a9378ee58d7e08d461ddf34a94}
    base-url: ${AMAP_WEB_BASE_URL:https://restapi.amap.com}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:urban-sidequest}
    secret: ${AUTH_JWT_SECRET:urban-sidequest-local-dev-secret-change-me}
    access-token-validity-seconds: ${AUTH_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:86400}
  dev-verification-code: ${AUTH_DEV_VERIFICATION_CODE:246810}
