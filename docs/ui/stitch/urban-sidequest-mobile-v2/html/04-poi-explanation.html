<script>
        // Micro-interaction for the handle (simulate swipe down to close)
        document.addEventListener('DOMContentLoaded', () => {
            const bottomSheet = document.querySelector('.bottom-sheet-anim');
            const closeBtn = document.querySelector('button[aria-label="Close"]');
            
            if(closeBtn && bottomSheet) {
                closeBtn.addEventListener('click', () => {
                    bottomSheet.style.transform = 'translateY(100%)';
                    bottomSheet.style.transition = 'transform 0.3s ease-in-out';
                    setTimeout(() => {
                        // In a real app, this would unmount or hide the component
                        console.log('Sheet closed');
                    }, 300);
                });
            }
        });
