<!-- 1. Top Nav -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md px-margin-mobile py-sm border-b border-outline-variant/30 flex items-center h-14">

</button>
<div class="flex-1">
<h1 class="font-headline-md text-headline-md text-on-surface">配置路线</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">苏州河附近 · 今天</p>
</div>
</header>
<main class="pt-16 px-margin-mobile max-w-[480px] mx-auto">

<div class="relative z-10 bg-surface/90 backdrop-blur-sm px-3 py-2 rounded-lg border border-outline-variant/50 flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div>
<div class="font-body-sm text-body-sm text-on-surface-variant">起点</div>
<div class="font-body-sm text-body-sm text-on-surface font-medium">酒店</div>
</div>
</div>
</div>
<!-- 3. Form Grouping -->
<div class="space-y-xl">
<!-- 4. Time Setting & 6. Start/End -->
<section class="space-y-md">
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">schedule</span>
<span class="font-body-lg text-body-lg text-on-surface">出发时间</span>
</div>
<button class="font-body-lg text-body-lg text-primary flex items-center gap-1 font-medium">
                        今天 13:30
                        <span class="material-symbols-outlined text-lg">chevron_right</span>
</button>
</div>
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">sync</span>
<span class="font-body-lg text-body-lg text-on-surface">回到起点</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>

<h2 class="font-body-lg text-body-lg font-medium text-on-surface-variant mb-sm">可用时长</h2>
<div class="flex gap-2">
<button class="flex-1 py-2 px-3 rounded-lg border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">4 小时</button>
<button class="flex-1 py-2 px-3 rounded-lg border-2 border-primary bg-primary-container/10 text-primary font-body-sm text-body-sm font-medium">6 小时</button>
<button class="flex-1 py-2 px-3 rounded-lg border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">一整天</button>
</div>
</section>
<!-- 7. Transport -->
<section>
<h2 class="font-body-lg text-body-lg font-medium text-on-surface-variant mb-sm">交通方式</h2>
<div class="flex flex-wrap gap-2">
<button class="py-2 px-4 rounded-full border-2 border-primary bg-primary-container/10 text-primary font-body-sm text-body-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-sm">directions_walk</span> + <span class="material-symbols-outlined text-sm">subway</span>
                        步行 + 地铁
                    </button>
<button class="py-2 px-4 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface flex items-center gap-1">
<span class="material-symbols-outlined text-sm">directions_bus</span> 公交
                    </button>
<button class="py-2 px-4 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface flex items-center gap-1">
<span class="material-symbols-outlined text-sm">local_taxi</span> 打车
                    </button>
<button class="py-2 px-4 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface flex items-center gap-1">
<span class="material-symbols-outlined text-sm">pedal_bike</span> 骑行
                    </button>
</div>
</section>
<!-- 8. Goal -->
<section>
<h2 class="font-body-lg text-body-lg font-medium text-on-surface-variant mb-sm">路线目标</h2>
<div class="grid grid-cols-2 gap-3">
<div class="rounded-lg border-2 border-primary bg-primary-container/10 p-3 flex flex-col items-start cursor-pointer">
<span class="material-symbols-outlined text-primary mb-1">shield_with_heart</span>
<span class="font-body-sm text-body-sm text-primary font-medium">稳妥省心</span>
</div>
<div class="rounded-lg border border-outline-variant bg-surface p-3 flex flex-col items-start cursor-pointer">
<span class="material-symbols-outlined text-outline mb-1">savings</span>
<span class="font-body-sm text-body-sm text-on-surface">更省钱</span>
</div>
<div class="rounded-lg border border-outline-variant bg-surface p-3 flex flex-col items-start cursor-pointer">
<span class="material-symbols-outlined text-outline mb-1">sentiment_satisfied</span>
<span class="font-body-sm text-body-sm text-on-surface">更轻松</span>
</div>
<div class="rounded-lg border border-outline-variant bg-surface p-3 flex flex-col items-start cursor-pointer">
<span class="material-symbols-outlined text-outline mb-1">explore</span>

</div>
</div>
</section>

<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">景点</button>
<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">展馆</button>
<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">拍照</button>
<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">夜游</button>
<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">低预算</button>
<button class="py-1.5 px-3 rounded-full border border-outline-variant text-on-surface font-body-sm text-body-sm bg-surface">冷门</button>
</div>
</section>
<!-- 10. Must-visit -->
<section>
<div class="flex items-center justify-between mb-sm">
<h2 class="font-body-lg text-body-lg font-medium text-on-surface-variant">必去点</h2>
<button class="text-primary flex items-center gap-1 font-body-sm text-body-sm">
<span class="material-symbols-outlined text-sm">add</span> 添加
                    </button>
</div>
<div class="space-y-sm">
<div class="border border-outline-variant/30 rounded-lg p-3 bg-surface-container-lowest">
<div class="font-body-sm text-body-sm text-on-surface-variant mb-2">必须保证</div>
<div class="border border-dashed border-outline-variant/50 rounded bg-surface-container py-3 flex items-center justify-center">
<span class="font-body-sm text-body-sm text-outline">搜索或在地图上添加地点</span>
</div>
</div>
<div class="border border-outline-variant/30 rounded-lg p-3 bg-surface-container-lowest">

<div class="border border-dashed border-outline-variant/50 rounded bg-surface-container py-3 flex items-center justify-center">
<span class="font-body-sm text-body-sm text-outline">搜索或在地图上添加地点</span>
</div>
</div>
</div>
</section>

</button>
