<div class="absolute top-1/4 left-[15%] w-[70%] h-[30%] border-[3px] border-dashed border-primary/60 rounded-xl pointer-events-none"></div>

<span class="w-2 h-2 bg-surface-container-lowest rounded-full"></span>
</div>
<div class="w-1.5 h-6 bg-primary opacity-80 mt-[-2px] rounded-b-full"></div>
</div>
<!-- POI Nodes (Deep Teal border with white background) -->
<div class="absolute top-[30%] left-[50%] w-3 h-3 bg-surface-container-lowest rounded-full border-2 border-primary shadow-sm"></div>
<div class="absolute top-[45%] left-[70%] w-3 h-3 bg-surface-container-lowest rounded-full border-2 border-primary shadow-sm"></div>
<div class="absolute top-[20%] left-[25%] w-3 h-3 bg-surface-container-lowest rounded-full border-2 border-primary shadow-sm"></div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">tune</span>
</button>
</div>
</div>
</div>
