name: urban-sidequest

services:
  postgres-init:
    build:
      context: .
      dockerfile: database/init/Dockerfile
    image: urban-sidequest-postgres-init:local
    environment:
      COMMON_POSTGRES_HOST: ${COMMON_POSTGRES_HOST:-common-postgres}
      COMMON_POSTGRES_PORT: ${COMMON_POSTGRES_PORT:-5432}
      COMMON_POSTGRES_DB: ${COMMON_POSTGRES_DB:-postgres}
      COMMON_POSTGRES_USER: ${COMMON_POSTGRES_USER:-postgres-root}
      COMMON_POSTGRES_PASSWORD: ${COMMON_POSTGRES_PASSWORD:-postgres-root-password}
      POSTGRES_DB: ${POSTGRES_DB:-urban_sidequest}
      POSTGRES_USER: ${POSTGRES_USER:-urban_sidequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_sidequest_dev}
    command: ["python3", "/app/database/init_database.py"]
    networks:
      - database-common-network

networks:
  database-common-network:
    external: true
    name: docker-database-common-network
