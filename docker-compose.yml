name: urban-sidequest

services:
  urban-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: urban-sidequest-backend:local
    container_name: urban-service
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./backend/config/private:/app/config/private:ro
    restart: unless-stopped
    networks:
      - database-common-network

  postgres-init:
    build:
      context: .
      dockerfile: database/init/Dockerfile
    image: urban-sidequest-postgres-init:local
    environment:
      TZ: Asia/Shanghai
      COMMON_POSTGRES_HOST: ${COMMON_POSTGRES_HOST:-common-postgres}
      COMMON_POSTGRES_PORT: ${COMMON_POSTGRES_PORT:-5432}
      COMMON_POSTGRES_DB: ${COMMON_POSTGRES_DB:-postgres}
      COMMON_POSTGRES_USER: ${COMMON_POSTGRES_USER:-postgres-root}
      COMMON_POSTGRES_PASSWORD: ${COMMON_POSTGRES_PASSWORD:-postgres-root-password}
      POSTGRES_DB: ${POSTGRES_DB:-urban_sidequest}
      POSTGRES_USER: ${POSTGRES_USER:-urban_sidequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_sidequest_dev}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["python3", "/app/database/init_database.py"]
    networks:
      - database-common-network

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ENDPOINT: ${COMMON_MINIO_ENDPOINT:-http://common-minio:9000}
      MINIO_ROOT_USER: ${COMMON_MINIO_ROOT_USER:-minio-root}
      MINIO_ROOT_PASSWORD: ${COMMON_MINIO_ROOT_PASSWORD:-minio-root-password}
      URBAN_MINIO_BUCKET: ${URBAN_MINIO_BUCKET:-urban-sidequest-training}
      URBAN_MINIO_USER: ${URBAN_MINIO_USER:-urban_sidequest}
      URBAN_MINIO_PASSWORD: ${URBAN_MINIO_PASSWORD:-urban_sidequest_dev_password}
      URBAN_MINIO_POLICY: ${URBAN_MINIO_POLICY:-urban-sidequest-training-rw}
      URBAN_SHARE_MINIO_BUCKET: ${URBAN_SHARE_MINIO_BUCKET:-urban-sidequest-shares}
      URBAN_SHARE_MINIO_PREFIX: ${URBAN_SHARE_MINIO_PREFIX:-route-share}
      URBAN_SHARE_MINIO_POLICY: ${URBAN_SHARE_MINIO_POLICY:-urban-sidequest-share-rw}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./scripts/minio:/scripts/minio:ro
    command: ["/scripts/minio/init_urban_sidequest_training_storage.sh"]
    networks:
      - minio-common-network

networks:
  database-common-network:
    external: true
    name: database-common-network
  minio-common-network:
    external: true
    name: database-common-network
